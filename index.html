<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSUKIRA | Anime Universe</title>

<style>

/* =========================================================
   TSUKIRA
   NEON PURPLE × BLACK × BLUE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    direction:rtl;

    color:#eeeaff;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(137,0,255,.20),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 25%,
            rgba(0,100,255,.13),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(110,0,220,.16),
            transparent 30%
        ),
        #030308;

    min-height:100vh;

    overflow-x:hidden;
}

/* ---------- ambient glow ---------- */

body::before,
body::after{
    content:"";
    position:fixed;
    z-index:-5;
    pointer-events:none;
    border-radius:50%;
    filter:blur(100px);
}

body::before{
    width:350px;
    height:350px;
    background:#6d00ff;
    opacity:.15;
    top:-130px;
    left:-100px;
    animation:orb1 12s infinite alternate ease-in-out;
}

body::after{
    width:300px;
    height:300px;
    background:#005eff;
    opacity:.12;
    bottom:-100px;
    right:-80px;
    animation:orb2 15s infinite alternate ease-in-out;
}

@keyframes orb1{
    to{
        transform:translate(250px,180px);
    }
}

@keyframes orb2{
    to{
        transform:translate(-220px,-150px);
    }
}

/* ---------- stars ---------- */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-4;
    opacity:.5;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#9d6cff 1px,transparent 1px);
    background-size:
        120px 120px,
        180px 180px;
    background-position:
        20px 30px,
        70px 100px;
    animation:starsMove 30s linear infinite;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(120px);
    }
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:9000;

    background:
        rgba(3,3,9,.76);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid
        rgba(165,70,255,.35);

    box-shadow:
        0 0 30px
        rgba(125,0,255,.13);
}

.nav{
    max-width:1200px;
    margin:auto;

    min-height:72px;

    padding:10px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    color:#d99aff;
    text-decoration:none;
    font-size:24px;
    font-weight:900;

    text-shadow:
        0 0 8px #8f26ff,
        0 0 25px #7a00ff;

    white-space:nowrap;
}

.logo span{
    color:#69cfff;
}

.nav-links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
}

.nav-links a,
.nav-links button{
    color:#e9e0f5;
    background:rgba(95,30,150,.12);

    border:
        1px solid
        rgba(168,84,255,.25);

    border-radius:12px;

    padding:8px 12px;

    text-decoration:none;
    cursor:pointer;

    font-family:inherit;

    transition:.25s;
}

.nav-links a:hover,
.nav-links button:hover{
    color:white;

    border-color:#a84cff;

    background:
        rgba(130,40,220,.28);

    box-shadow:
        0 0 15px
        rgba(155,50,255,.35);

    transform:translateY(-2px);
}

/* =========================================================
   MAIN
========================================================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px 16px 80px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:520px;

    margin-top:15px;
    margin-bottom:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;
    overflow:hidden;

    border:
        1px solid
        rgba(165,70,255,.3);

    border-radius:32px;

    background:
        linear-gradient(
            135deg,
            rgba(25,8,45,.88),
            rgba(3,9,25,.92)
        );

    box-shadow:
        0 0 60px
        rgba(105,0,220,.13);
}

.hero::before{
    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
        conic-gradient(
            transparent,
            rgba(155,55,255,.2),
            transparent,
            rgba(0,120,255,.12),
            transparent
        );

    animation:
        heroSpin 16s linear infinite;
}

@keyframes heroSpin{
    to{
        transform:rotate(360deg);
    }
}

.hero-content{
    position:relative;
    z-index:2;
    padding:30px;
}

.hero-mini{
    display:inline-block;

    color:#bda3ff;

    padding:8px 18px;

    border:
        1px solid
        rgba(170,80,255,.5);

    border-radius:30px;

    background:
        rgba(100,20,170,.12);

    box-shadow:
        0 0 20px
        rgba(130,40,255,.12);

    margin-bottom:25px;
}

.hero h1{
    font-size:
        clamp(42px,8vw,82px);

    line-height:1.15;

    margin-bottom:22px;

    color:white;

    text-shadow:
        0 0 10px #9d40ff,
        0 0 35px rgba(125,0,255,.7);
}

.hero h1 span{
    color:#d08cff;
}

.hero p{
    max-width:680px;

    margin:auto;

    line-height:2;

    color:#aaa2b5;

    font-size:15px;
}

.hero-button{
    display:inline-block;

    margin-top:30px;

    padding:13px 25px;

    border-radius:15px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            135deg,
            #791bd0,
            #354bd7
        );

    border:
        1px solid
        #b45cff;

    box-shadow:
        0 0 25px
        rgba(120,30,255,.35);

    transition:.3s;
}

.hero-button:hover{
    transform:translateY(-4px);

    box-shadow:
        0 0 40px
        rgba(145,40,255,.65);
}

/* =========================================================
   TITLES
========================================================= */

.section{
    margin-bottom:70px;
}

.section-title{
    text-align:center;

    color:#e0b8ff;

    font-size:30px;

    margin-bottom:8px;

    text-shadow:
        0 0 15px
        rgba(165,60,255,.55);
}

.section-sub{
    text-align:center;

    color:#817a8c;

    margin-bottom:25px;
}

/* =========================================================
   SEARCH
========================================================= */

.search{
    max-width:760px;
    margin:0 auto 28px;
}

.search input{
    width:100%;

    padding:16px 20px;

    color:white;

    background:
        rgba(7,5,15,.82);

    border:
        1px solid
        rgba(165,70,255,.38);

    border-radius:18px;

    outline:none;

    font-family:inherit;

    transition:.25s;
}

.search input:focus{
    border-color:#a852ff;

    box-shadow:
        0 0 25px
        rgba(145,50,255,.2);
}

/* =========================================================
   FILTERS
========================================================= */

.filters{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
}

.filter{
    padding:8px 13px;

    color:#b9afc3;

    background:
        rgba(100,30,150,.12);

    border:
        1px solid
        rgba(150,70,240,.25);

    border-radius:12px;

    cursor:pointer;

    font-family:inherit;
}

.filter.active,
.filter:hover{
    color:white;

    background:
        rgba(125,35,205,.35);

    border-color:#a84cff;
}

/* =========================================================
   ANIME GRID
========================================================= */

.anime-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(270px,1fr)
        );

    gap:20px;
}

.anime-card{
    position:relative;

    padding:21px;

    border-radius:23px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,12,40,.94),
            rgba(5,9,20,.96)
        );

    border:
        1px solid
        rgba(157,70,245,.25);

    transition:
        transform .3s,
        border-color .3s,
        box-shadow .3s;
}

.anime-card::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-100px;
    top:-100px;

    border-radius:50%;

    background:
        rgba(155,50,255,.18);

    filter:blur(35px);

    transition:.4s;
}

.anime-card::after{
    content:"";

    position:absolute;

    top:-100%;
    left:-50%;

    width:40%;
    height:300%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.06),
            transparent
        );

    transform:rotate(20deg);

    transition:.7s;

    pointer-events:none;
}

.anime-card:hover::after{
    left:130%;
}

.anime-card:hover{
    transform:translateY(-8px);

    border-color:
        rgba(177,79,255,.75);

    box-shadow:
        0 18px 50px
        rgba(102,20,200,.23),
        0 0 20px
        rgba(125,40,255,.12);
}

.anime-title{
    color:#dca7ff;

    font-size:21px;

    font-weight:800;

    margin-bottom:5px;
}

.anime-fa{
    color:#81788d;

    font-size:12px;

    margin-bottom:12px;
}

.rating{
    color:#ffd76a;

    font-size:13px;

    margin-bottom:10px;
}

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:5px;

    margin-bottom:12px;
}

.tag{
    padding:5px 8px;

    border-radius:9px;

    font-size:9px;

    color:#cbb6e2;

    background:
        rgba(110,35,170,.16);

    border:
        1px solid
        rgba(145,65,220,.18);
}

.sub-tag{
    color:#65dfff;

    background:
        rgba(0,110,150,.13);

    border-color:
        rgba(0,180,220,.2);
}

.anime-dialogue{
    min-height:68px;

    padding:11px;

    border-radius:13px;

    background:
        rgba(0,0,0,.23);

    border-right:
        2px solid
        #8041c7;

    color:#b9b1c1;

    font-size:11px;

    line-height:1.9;

    margin:13px 0;
}

.anime-dialogue strong{
    color:#bb83ed;
}

.card-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.card-buttons button{
    flex:1;

    min-width:105px;

    padding:9px 8px;

    border-radius:11px;

    color:white;

    background:
        rgba(100,30,160,.17);

    border:
        1px solid
        rgba(165,70,255,.3);

    cursor:pointer;

    font-family:inherit;

    transition:.2s;
}

.card-buttons button:hover{
    background:
        rgba(125,40,205,.38);

    border-color:#a64eff;
}

.card-buttons .watch{
    background:
        linear-gradient(
            135deg,
            #711dcc,
            #3247cf
        );
}

/* =========================================================
   LIBRARY
========================================================= */

.library-box,
.account-box{
    max-width:900px;

    margin:auto;

    padding:22px;

    border-radius:22px;

    background:
        rgba(10,7,17,.75);

    border:
        1px solid
        rgba(155,70,245,.25);

    box-shadow:
        0 0 35px
        rgba(100,20,200,.07);
}

.library-list{
    display:grid;
    gap:10px;
}

.library-item{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:14px;

    border-radius:14px;

    background:
        rgba(90,25,140,.12);

    border:
        1px solid
        rgba(145,65,220,.18);
}

.library-item button{
    padding:7px 11px;

    color:white;

    background:#512044;

    border:0;

    border-radius:9px;

    cursor:pointer;
}

.empty{
    text-align:center;

    padding:30px;

    color:#777080;
}

/* =========================================================
   ACCOUNT
========================================================= */

.account-content{
    text-align:center;
}

.account-avatar{
    width:75px;
    height:75px;

    margin:0 auto 15px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    background:
        radial-gradient(
            circle,
            #6c2baa,
            #151020
        );

    border:
        1px solid
        #9d52e9;

    box-shadow:
        0 0 25px
        rgba(145,50,255,.35);
}

.account-name{
    color:#d7a2ff;

    font-size:20px;

    font-weight:bold;

    margin-bottom:7px;
}

.account-email{
    color:#7f7788;

    font-size:12px;
}

.account-button{
    margin-top:18px;

    padding:10px 18px;

    border-radius:12px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #6e1fc0,
            #3943c9
        );

    border:
        1px solid
        #9f50eb;

    cursor:pointer;

    font-family:inherit;
}

/* =========================================================
   MODALS
========================================================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:10000;

    padding:15px;

    overflow-y:auto;

    background:
        rgba(1,1,5,.94);

    backdrop-filter:blur(12px);
}

.modal.active{
    display:block;
}

.modal-box{
    max-width:950px;

    margin:20px auto;

    padding:22px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #160b23,
            #070a14
        );

    border:
        1px solid
        rgba(160,70,240,.5);

    box-shadow:
        0 20px 90px
        rgba(0,0,0,.7);
}

.modal-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    margin-bottom:20px;
}

.modal-title{
    color:#dba8ff;

    font-size:23px;

    font-weight:800;
}

.close{
    padding:8px 13px;

    border-radius:11px;

    background:
        rgba(100,30,150,.2);

    color:white;

    border:
        1px solid
        #713cb0;

    cursor:pointer;

    font-family:inherit;
}

/* =========================================================
   SEASONS
========================================================= */

.seasons{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:20px;
}

.season{
    padding:9px 14px;

    border-radius:11px;

    color:#c6add7;

    background:
        rgba(100,30,150,.15);

    border:
        1px solid
        rgba(155,70,240,.25);

    cursor:pointer;

    font-family:inherit;
}

.season.active,
.season:hover{
    color:white;

    background:#7032b7;

    border-color:#a755ef;

    box-shadow:
        0 0 15px
        rgba(135,45,220,.25);
}

/* =========================================================
   EPISODES
========================================================= */

.episodes{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(145px,1fr)
        );

    gap:10px;
}

.episode{
    padding:13px 8px;

    border-radius:13px;

    color:white;

    background:
        rgba(22,16,31,.95);

    border:
        1px solid
        rgba(150,70,235,.23);

    cursor:pointer;

    font-family:inherit;

    transition:.2s;
}

.episode:hover{
    transform:translateY(-3px);

    background:#55218d;

    border-color:#a958f3;

    box-shadow:
        0 8px 25px
        rgba(115,30,210,.2);
}

.episode-number{
    font-weight:bold;
}

.episode-sub{
    color:#65ddff;

    display:block;

    margin-top:5px;

    font-size:9px;
}

/* =========================================================
   VIDEO
========================================================= */

.video-container{
    display:none;

    margin-top:25px;

    border-radius:18px;

    overflow:hidden;

    background:#000;

    border:
        1px solid
        #7138af;
}

.video-container.active{
    display:block;
}

.video-container video{
    display:block;

    width:100%;

    max-height:580px;

    background:#000;
}

.video-info{
    padding:14px;

    background:#120d19;

    color:#d3a0f5;

    line-height:1.8;
}

/* =========================================================
   LOGIN
========================================================= */

.form{
    display:grid;

    gap:12px;
}

.form input{
    width:100%;

    padding:13px 15px;

    border-radius:13px;

    outline:none;

    background:#080710;

    color:white;

    border:
        1px solid
        rgba(160,70,240,.3);

    font-family:inherit;
}

.form input:focus{
    border-color:#a652ee;

    box-shadow:
        0 0 15px
        rgba(145,50,230,.18);
}

.form button{
    padding:12px;

    border-radius:13px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #7120c8,
            #3545cb
        );

    border:
        1px solid
        #a252ec;

    cursor:pointer;

    font-family:inherit;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    bottom:25px;

    left:50%;

    transform:
        translate(-50%,120px);

    z-index:20000;

    padding:12px 18px;

    border-radius:13px;

    color:white;

    background:
        rgba(25,12,40,.96);

    border:
        1px solid
        #9245d4;

    box-shadow:
        0 0 25px
        rgba(135,40,230,.3);

    transition:.35s;
}

.toast.show{
    transform:
        translate(-50%,0);
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    text-align:center;

    padding:35px 15px;

    color:#706979;

    border-top:
        1px solid
        rgba(145,60,230,.18);
}

footer strong{
    color:#c47cff;

    text-shadow:
        0 0 10px
        rgba(150,50,255,.5);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

    .nav{
        justify-content:center;
    }

    .logo{
        width:100%;
        text-align:center;
    }

    .hero{
        min-height:430px;
    }

    .anime-grid{
        grid-template-columns:1fr;
    }

    .episodes{
        grid-template-columns:
            repeat(2,1fr);
    }

    .modal{
        padding:7px;
    }

    .modal-box{
        margin:5px auto;
        padding:15px;
    }

}

</style>
</head>
